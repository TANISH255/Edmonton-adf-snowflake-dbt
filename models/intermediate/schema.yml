version: 2

models:
  - name: int_request_metrics
    columns:
      - name: request_number
        data_tests:
          - unique
          - not_null

      - name: status_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Resolved
                  - Closed - Not Resolved
                  - Open
                  - Unknown